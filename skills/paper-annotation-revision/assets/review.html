<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root {
  color-scheme: light;
  font-family: "Source Sans 3", "Noto Sans CJK SC", system-ui, sans-serif;
  color: #17252c;
  background: #f7f8f7;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 72rem; margin: 0 auto; padding: 2.5rem clamp(0.75rem, 4vw, 3rem); }
h1, h2, h3, p, blockquote { margin: 0; }
h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); line-height: 1.25; }
h2 { font-size: 1.25rem; line-height: 1.4; }
h3 { font-size: 0.9rem; margin-bottom: 0.4rem; }
p, blockquote, li { line-height: 1.65; }
a { color: #175967; text-underline-offset: 0.2em; overflow-wrap: anywhere; }
a:focus-visible, summary:focus-visible { outline: 2px solid #175967; outline-offset: 4px; }
.baseline { margin-top: 0.6rem; color: #48595e; overflow-wrap: anywhere; }
nav { margin: 1.5rem 0 0; }
nav ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem 1.2rem; }
article { scroll-margin-top: 1rem; margin-top: 1.5rem; padding: clamp(0.9rem, 3vw, 1.6rem); background: #fff; border: 1px solid #ccd8d9; border-radius: 0.65rem; }
article:target { border-color: #175967; }
.item-header { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem 1rem; flex-wrap: wrap; }
.item-header h2 { overflow-wrap: anywhere; }
.status { color: #31585b; font-size: 0.9rem; }
.comment { border-inline-start: 0.2rem solid #9bb8b8; margin: 1rem 0; padding-inline-start: 0.8rem; color: #37494d; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin-top: 1rem; }
.compare:has(section:only-child) { grid-template-columns: minmax(0, 1fr); }
.compare section { padding: 0.85rem; border: 1px solid #dde5e6; border-radius: 0.4rem; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
mark { color: inherit; background: #ffe485; }
ins { color: #a32236; text-decoration: none; font-weight: 600; }
.item-note { margin-top: 1rem; }
details { margin-top: 1rem; }
summary { cursor: pointer; color: #175967; }
details ul { margin-bottom: 0; padding-inline-start: 1.25rem; }
details blockquote { margin: 0.25rem 0 0.5rem; color: #48595e; }
@media (max-width: 44rem) { .compare { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
<header>
<h1>$title</h1>
$baseline
</header>
$navigation
$items
</main>
</body>
</html>
